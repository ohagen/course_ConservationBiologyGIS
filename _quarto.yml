project:
  type: website
  output-dir: _site

website:
  title: "Conservation Biology – Biotype Mapping and Data Processing"
  sidebar:
    style: docked
    search: true
    contents:

      - section: "1. Introduction"
        contents:
          - index.qmd

      - section: "2. QField - Fieldwork Application"
        contents:
          - qfield_tutorial.qmd
          

      - section: "3. QGIS - Data Processing and Visualization"
        contents:
          - qgis_tutorial.qmd

      - section: "4.Spatial Data Analysis in R"
        contents:
          - r_spatial_tutorial.qmd
format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    code-tools: true
    highlight-style: github

execute:
  echo: true
  warning: false
  message: false
